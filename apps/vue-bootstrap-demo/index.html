<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue-bootstrap-demo</title>
    <!-- Native form controls and scrollbars follow the theme; the browser chrome
         colour follows the OS scheme. -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#212529">
    <!-- Theme pre-boot (PRD dark-mode D5, D5b): the site default, then the blocking
         script that applies the bs-theme-mode cookie (or this default, or the OS
         scheme) to the root data-bs-theme attribute before any stylesheet evaluates, so a
         dark user never sees a light flash. Both must stay ahead of the styles.
         The script is @mintplayer/web-components/theming/bs-theme-preboot.js,
         served and emitted by tools/vite/theme-preboot.mts. server.mjs reads this
         meta too, so the SSR splice uses the same default. -->
    <meta name="bs-theme-default-mode" content="auto">
    <script src="/theming/bs-theme-preboot.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
