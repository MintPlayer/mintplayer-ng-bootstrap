<h1 class="text-center">Close button</h1>

<p>
  <code>bs-close</code> renders Bootstrap's standardised dismiss button — a
  small "×" affordance suitable for alerts, modals, and toast headers. It is a real
  <code>&lt;button&gt;</code> named by <code>label</code> (default "Close"); listen for its
  native click.
</p>

<h2>Basic usage</h2>

<p class="d-flex align-items-center gap-3">
  <bs-close label="Dismiss notice" (click)="onClose()"></bs-close>
  <span>Click me</span>
</p>

<h2>Disabled</h2>

<p class="d-flex align-items-center gap-3">
  <bs-close disabled></bs-close>
  <span>Disabled</span>
</p>
