<h1 class="text-center">Breadcrumb</h1>

<p>
  <code>bs-breadcrumb</code> renders a Bootstrap breadcrumb trail; each
  <code>bs-breadcrumb-item</code> hosts a link or label and the last item is
  marked <code>active</code>: the current page (<code>aria-current="page"</code>).
</p>

<h2>Basic usage</h2>

<bs-breadcrumb>
    <bs-breadcrumb-item>
        <a [routerLink]='["/"]'>Home</a>
    </bs-breadcrumb-item>
    <bs-breadcrumb-item>
        <a [routerLink]='["/basic"]'>Basic</a>
    </bs-breadcrumb-item>
    <bs-breadcrumb-item active>
        Breadcrumb
    </bs-breadcrumb-item>
</bs-breadcrumb>
