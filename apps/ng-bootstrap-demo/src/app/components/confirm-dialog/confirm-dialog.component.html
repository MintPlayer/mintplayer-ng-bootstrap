<bs-modal [(open)]="isOpen">
  <span *bsModalHeader>{{ title() }}</span>
  {{ message() }}
  <ng-container *bsModalFooter>
    <button type="button" class="btn btn-light bg-transparent" (click)="onChoice(false)">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="onChoice(true)">OK</button>
  </ng-container>
</bs-modal>
