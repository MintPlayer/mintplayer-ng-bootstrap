name: Angular build cache
description: >
  Restores and saves .angular/cache, the Angular compiler's persistent cache,
  for jobs that start `nx serve ng-bootstrap-demo`. Its effect is per FILE, so
  it helps on exactly the runs Nx's all-or-nothing task cache cannot: a PR that
  changed the demo or a library still recompiles only what it changed.
  Measured locally: dev-server ready in 48 s with an empty cache, 36 s warm.
  Angular only writes the cache on CI because apps/ng-bootstrap-demo/project.json
  sets `cli.cache.environment: all` (the default, `local`, turns it off when
  CI=true).

runs:
  using: composite
  steps:
    # A fresh key per run, so every run saves what it compiled (the jobs of one
    # run race for the same key; the first to finish wins, which is fine).
    # restore-keys picks the newest entry for this lockfile, i.e. this PR's
    # previous run. The lockfile pins the Angular version, which also names the
    # cache's version folder.
    - name: Cache .angular/cache
      uses: actions/cache@v4
      with:
        path: .angular/cache
        key: angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
        restore-keys: |
          angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
