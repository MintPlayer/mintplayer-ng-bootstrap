name: Setup workspace
description: >
  Node 24 + node_modules and/or .NET 10, as the job needs. Shared by every job
  of both workflows, which run their jobs in parallel instead of as one long
  sequence. Run actions/checkout first: a local action can only be used once
  the repository is on disk.

inputs:
  node:
    description: Install Node 24 and the workspace's node_modules.
    default: 'true'
  dotnet:
    description: >
      Install .NET 10. Needed by the API tests and by every job whose dev/e2e
      server starts the API as a continuous dependency.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup node
      if: inputs.node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 24

    # node_modules itself, not just ~/.npm: restoring the tree takes a few
    # seconds where `npm ci` from the npm cache took ~30 s per job. The key is
    # the lockfile plus the Node version, which together pin every byte npm
    # would write. On a hit `npm ci` is skipped entirely.
    - name: Cache node_modules
      if: inputs.node == 'true'
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: inputs.node == 'true' && steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # `npm ci` runs postinstall itself; a restored tree does not. Postinstall
    # writes the codegen-wc output (generated *.styles.ts / *.template.ts, which
    # are gitignored and live outside node_modules), so it must run either way.
    - name: Run postinstall (restored node_modules)
      if: inputs.node == 'true' && steps.node-modules.outputs.cache-hit == 'true'
      shell: bash
      run: npm run postinstall

    - name: Setup .NET 10
      if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
