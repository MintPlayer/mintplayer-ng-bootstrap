name: pull-request

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Self-hosted Nx remote cache. RW token is only used on push to the default
# branch; everything else (PRs, feature branches) gets the read-only token.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}

permissions:
  contents: read

# The jobs run in PARALLEL, not as one long sequence: build + unit tests, the
# e2e suites (the Angular one in two shards), the axe gate per app and the
# live-API smoke each get their own runner. Public repository, so standard
# runners cost nothing extra; each job pays ~1.5 min of setup and the wall time
# becomes the slowest job instead of the sum of all of them (was 15+ min).
# Every job checks the repo out with full history (`nx affected` diffs against
# the PR base SHA) and then runs the shared ./.github/actions/setup.
#
# NOTE on checkout: `lfs: true` used to be set to fetch the Playwright
# visual-regression baselines. It was pure cost — the only LFS objects in the
# repo are those baselines, and the visual specs skip themselves on Linux, so CI
# paid LFS bandwidth every run for PNGs nothing then read. Visual regression is
# deliberately a local-only check; see apps/ng-bootstrap-demo-e2e/VISUAL-BASELINES.md
# for why, and put it back if that ever changes.
jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup workspace
      uses: ./.github/actions/setup

    - name: Build
      timeout-minutes: 15
      run: npx nx build --configuration=production

    - name: Unit tests
      timeout-minutes: 15
      # --exclude=api: nx:run-commands forwards --coverage verbatim to
      # `dotnet test` (VSTest), which rejects it. The API has its own step below.
      run: npx nx affected --target=test --exclude=api --coverage --parallel=2 --output-style=stream --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }}

    - name: Test API (xUnit, with coverage)
      timeout-minutes: 10
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory
      # of --results-directory, hence the ** in the upload glob.
      run: dotnet test apps/api/Tests/Api.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage/api
    # Vitest writes `SF:` paths relative to each project's own root, so
    # `libs/mintplayer-web-components/dock/index.ts` is emitted as
    # `dock/index.ts` — a suffix that exists under four different libraries.
    # The service resolves report paths against `git ls-files` by longest
    # suffix and drops anything ambiguous from the totals. Measured: 314 of
    # 1405 files (22.3%) silently excluded, incl. ~58% of react and vue.
    # This rewrites them to workspace-relative, and fails loudly if any path
    # stops resolving.
    - name: Rebase coverage paths to workspace-relative
      run: node tools/scripts/rebase-lcov-paths.mjs


    # Nothing in this workflow gates the merge. The service publishes the
    # `coverage/project` and `coverage/patch` check runs itself, and those are
    # what branch protection will eventually require — so there is deliberately
    # no comparison step here to delete later (docs/prd/coverage-pr-gate-plan.md).
    #
    # `partial: true` is the load-bearing input. This is `nx affected`, so it
    # measures only the projects the diff touched; without the declaration the
    # server would read a subset as a whole-workspace total and a PR touching one
    # small library would report a ~98% collapse. Declared, it compares
    # like-for-like against the same base the affected-computation used.
    #
    # `base-sha` is that same base, and passing it explicitly matters: left out,
    # the server falls back to the newest covered default-branch commit — which
    # it discloses, but which is not the commit `nx affected` diffed against.
    - name: Upload coverage
      # Fork PRs get no secrets, so the upload cannot work there. Skip rather
      # than fail — a contributor's PR must not go red over a missing token.
      # (OIDC is unavailable to fork PRs too, so this guard stays either way.)
      if: github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/libs/*/lcov.info
          coverage/tools/lcov.info
          coverage/api/**/coverage.cobertura.xml
        disable-search: true
        flags: pr
        partial: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # Closes the build now instead of waiting out the ~2-minute debounce, so
        # the check runs appear while the PR is still being looked at. Safe for a
        # partial upload only because `partial: true` above tells the server what
        # it is receiving — a partial build can never become the repo headline.
        finish: true
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false

    # Hand dist/ off to the dry-run-publish-libs job. Snippets publishes
    # from libs/ (source); the dry-run job checks the repo out so we don't
    # need to bundle it into this artifact.
    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 1

  # One runner per e2e suite, the Angular one (by far the longest: ~480 tests
  # over Chromium + Firefox) split into two Playwright shards. Still `affected`:
  # each job asks Nx whether its project is affected by the PR and skips its
  # browsers and its run when it is not, exactly as the old single
  # `nx affected --target=e2e` step did for the whole set.
  e2e:
    name: e2e (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: ng 1/2, project: ng-bootstrap-demo-e2e, shard: 1/2, artifact: ng-1 }
          - { label: ng 2/2, project: ng-bootstrap-demo-e2e, shard: 2/2, artifact: ng-2 }
          - { label: react, project: react-bootstrap-demo-e2e, shard: 1/1, artifact: react }
          - { label: vue, project: vue-bootstrap-demo-e2e, shard: 1/1, artifact: vue }

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup workspace
      uses: ./.github/actions/setup

    - name: Is ${{ matrix.project }} affected?
      id: affected
      run: |
        if npx nx show projects --affected --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }} | grep -qx '${{ matrix.project }}'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.project }} is not affected by this PR; skipping."
        fi

    - name: Install Playwright browsers
      if: steps.affected.outputs.run == 'true'
      uses: ./.github/actions/playwright

    - name: E2E tests
      if: steps.affected.outputs.run == 'true'
      timeout-minutes: 30
      # Extra flags on an nx:run-commands target are forwarded to the command,
      # so --shard reaches `playwright test`.
      run: npx nx run ${{ matrix.project }}:e2e --output-style=stream --shard=${{ matrix.shard }}

    # Playwright is configured with `trace: 'on-first-retry'`, so a retried test
    # already records a full trace — but nothing collected it, so the two flakes
    # on PR #405 left no evidence behind and had to be diagnosed by inference.
    #
    # `if: always()` because the interesting case is a run that FAILED, and
    # `if-no-files-found: ignore` because a clean run legitimately produces
    # nothing: traces only exist once a test has been retried.
    - name: Upload Playwright traces
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces-${{ matrix.artifact }}
        path: apps/*-e2e/test-results/
        if-no-files-found: ignore
        retention-days: 7

  # Accessibility gate — deliberately NOT `affected`, so it runs on every PR and
  # cannot be silenced by the affected graph. Fails on any serious/critical axe
  # finding across the three demo apps, hydrated AND no-JS SSR tiers (see
  # tools/e2e-shared/axe-suites.ts). One runner per app.
  e2e-a11y:
    name: axe (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ng, react, vue]

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup workspace
      uses: ./.github/actions/setup

    - name: Install Playwright browsers
      uses: ./.github/actions/playwright

    - name: E2E accessibility gate (axe)
      timeout-minutes: 30
      run: npx nx run ${{ matrix.app }}-bootstrap-demo-e2e:e2e-a11y --output-style=stream

    - name: Upload Playwright traces
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces-a11y-${{ matrix.app }}
        path: apps/*-e2e/test-results/
        if-no-files-found: ignore
        retention-days: 7

  # Live-API contract smoke. Boots `dotnet run` + `ng serve` and runs the
  # query-builder specs unmocked against the real .NET backend. On its own
  # runner, so no other suite's API process can still hold :5000 (the
  # sequential workflow needed a step that force-freed the port first).
  e2e-live:
    name: e2e (live API)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup workspace
      uses: ./.github/actions/setup

    - name: Install Playwright browsers
      uses: ./.github/actions/playwright

    - name: E2E (live API)
      timeout-minutes: 15
      run: npx nx run ng-bootstrap-demo-e2e:e2e-live --output-style=stream

    - name: Upload Playwright traces
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces-live
        path: apps/*-e2e/test-results/
        if-no-files-found: ignore
        retention-days: 7

  # The single check that sums the parallel jobs up, under the name the old
  # single job had (`pull-request`), so branch protection or anything else that
  # looks for that check keeps working. `if: always()` so it reports a failure
  # instead of being skipped when a job it needs failed.
  pull-request:
    name: pull-request
    if: always()
    needs: [build, e2e, e2e-a11y, e2e-live]
    runs-on: ubuntu-latest

    steps:
    - name: All jobs passed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "build: ${{ needs.build.result }}, e2e: ${{ needs.e2e.result }}, e2e-a11y: ${{ needs.e2e-a11y.result }}, e2e-live: ${{ needs.e2e-live.result }}"
        exit 1

  # Single dry-run sweep covering both folder roots (dist/libs + the
  # snippets source dir). The action handles discovery, topo-sort and
  # the per-package npm publish --dry-run internally; no need for the
  # 9 hand-listed JS-DevTools/npm-publish dry-run steps that used to
  # live in the build job.
  dry-run-publish-libs:
    name: dry-run-publish-libs
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Dry-run publish (dist/libs)
        uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
        with:
          folder: dist/libs
          dry-run: true
          registries: |
            [
              { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}", "provenance": false }
            ]

      - name: Dry-run publish (snippets source)
        uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
        with:
          folder: libs/mintplayer-ng-bootstrap-snippets
          dry-run: true
          registries: |
            [
              { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}", "provenance": false }
            ]