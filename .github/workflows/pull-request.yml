name: pull-request

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Self-hosted Nx remote cache. RW token is only used on push to the default
# branch; everything else (PRs, feature branches) gets the read-only token.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}

jobs:
  build:
  
    name: pull-request
    runs-on: ubuntu-latest
    
    permissions: 
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Full history: `nx affected` below diffs against the PR base SHA.
        fetch-depth: 0
        # NOTE: `lfs: true` was here to fetch the Playwright visual-regression
        # baselines. It was pure cost — the only LFS objects in the repo are
        # those baselines, and the visual specs skip themselves on Linux, so CI
        # paid LFS bandwidth every run for PNGs nothing then read. Visual
        # regression is deliberately a local-only check; see
        # apps/ng-bootstrap-demo-e2e/VISUAL-BASELINES.md for why, and put this
        # back if that ever changes.
    
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        # Caches ~/.npm keyed on the lockfile, so `npm ci` resolves from disk
        # instead of re-downloading every package on every run.
        cache: 'npm'

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install dependencies
      run: npm ci

    # The three engines are ~400 MB and were re-downloaded on every run. The
    # key is the lockfile hash because the required browser build is pinned by
    # the Playwright version in it — a Playwright bump invalidates the cache,
    # which is exactly when new builds are needed.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium firefox webkit

    # On a cache hit the binaries are already there, but the OS-level libraries
    # they link against are not — those live outside the cached directory and
    # have to be installed every run regardless.
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium firefox webkit

    - name: Build
      timeout-minutes: 15
      run: npx nx build --configuration=production

    - name: Unit tests
      timeout-minutes: 15
      run: npx nx affected --target=test --parallel=2 --output-style=stream --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }}

    - name: Test API (xUnit)
      timeout-minutes: 10
      run: dotnet test apps/api/Tests/Api.Tests.csproj -c Debug

    - name: E2E tests
      timeout-minutes: 30
      run: npx nx affected --target=e2e --parallel=1 --output-style=stream --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }}

    # Accessibility gate — deliberately `run-many`, NOT `affected`, so it runs
    # on every PR and cannot be silenced by the affected graph. Fails on any
    # serious/critical axe finding across the three demo apps, hydrated AND
    # no-JS SSR tiers (see tools/e2e-shared/axe-suites.ts).
    - name: E2E accessibility gate (axe)
      timeout-minutes: 30
      run: npx nx run-many -t e2e-a11y --parallel=1 --output-style=stream

    # Force-free :5000 in case Nx's continuous-task teardown didn't propagate
    # SIGTERM to api:serve cleanly — the leftover dotnet would otherwise
    # collide with the live-API step's webServer trying to boot a second
    # dotnet on the same port. Harmless if :5000 is already free.
    - name: Free :5000 before live-API step
      if: always()
      run: lsof -ti:5000 | xargs -r kill -9 || true

    # Live-API contract smoke. Boots `dotnet run` + `ng serve` and runs the
    # query-builder specs unmocked against the real .NET backend.
    - name: E2E (live API)
      timeout-minutes: 15
      run: npx nx run ng-bootstrap-demo-e2e:e2e-live --output-style=stream

    # Hand dist/ off to the dry-run-publish-libs job. Snippets publishes
    # from libs/ (source); the dry-run job checks the repo out so we don't
    # need to bundle it into this artifact.
    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 1

  # Single dry-run sweep covering both folder roots (dist/libs + the
  # snippets source dir). The action handles discovery, topo-sort and
  # the per-package npm publish --dry-run internally; no need for the
  # 9 hand-listed JS-DevTools/npm-publish dry-run steps that used to
  # live in the build job.
  dry-run-publish-libs:
    name: dry-run-publish-libs
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Dry-run publish (dist/libs)
        uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
        with:
          folder: dist/libs
          dry-run: true
          registries: |
            [
              { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}", "provenance": false }
            ]

      - name: Dry-run publish (snippets source)
        uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
        with:
          folder: libs/mintplayer-ng-bootstrap-snippets
          dry-run: true
          registries: |
            [
              { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}", "provenance": false }
            ]