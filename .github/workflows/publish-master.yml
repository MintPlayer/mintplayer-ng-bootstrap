name: publish-master

on:
  push:
    branches: [ master ]

# A newer push cancels the run in flight, even between the npm publish and the
# deploy: the newer run publishes and deploys the newer commit anyway (decided
# in docs/prd/ci-workflow-speed.md, D6).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Self-hosted Nx remote cache. RW token is only used on push to the default
# branch; everything else (PRs, feature branches) gets the read-only token.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}

# The jobs run in PARALLEL wherever nothing forces an order, the same layout
# pull-request.yml uses (docs/prd/ci-workflow-speed.md):
#
#   build ──────────────┐
#   tests (test.yml) ───┼─► docker (×4, matrix) ─► deploy
#                       ├─► publish-libs
#                       └─► publish-snippets
#   tests ─► coverage
#
# The publishing gate: nothing a test covers reaches npm or GHCR unless every
# `tests` leg passed (the unit-test shards and the API's xUnit tests). The images are built from the very `dist` the build
# job produced, so what is deployed is what was tested — the old image steps
# ran `npm install` + `nx build` a second time inside Docker, which was ~95% of
# their ~5 minutes.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup workspace
      uses: ./.github/actions/setup
      with:
        dotnet: 'false'

    - name: Build
      # run-many so EVERY publishable lib lands in dist/libs/ for the
      # discovery action. Plain `nx build` only builds the default
      # project (ng-bootstrap-demo) and its transitive deps — react-
      # and vue-bootstrap aren't reachable from there, so they were
      # silently absent from the publish plan on the first PR-4 deploy.
      # build-ssr: the React and Vue SSR server bundles, which the demo images
      # copy alongside the client bundles.
      run: npx nx run-many -t build build-ssr --configuration=production

    # Hands dist/ to the docker and publish-libs jobs. The snippets package
    # publishes from libs/ (source, not dist/), so it is not in here.
    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 1

  # Every unit-test suite as parallel jobs, web-components and ng-bootstrap in
  # two vitest shards each, plus the API's xUnit tests (test.yml, shared with
  # pull-request.yml).
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # A side job, NOT a publishing gate: publishing depends on the tests passing,
  # never on the coverage service being up. A failed upload still turns the
  # run red through the aggregator, it just cannot hold a deploy back.
  coverage:
    name: coverage
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # rebase-lcov-paths.mjs imports only node: built-ins and a local helper,
    # so Node itself is enough: no node_modules, no .NET.
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Download coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        merge-multiple: true

    # Vitest writes `SF:` paths relative to each project's own root, so
    # `libs/mintplayer-web-components/dock/index.ts` is emitted as
    # `dock/index.ts` — a suffix that exists under four different libraries.
    # The service resolves report paths against `git ls-files` by longest
    # suffix and drops anything ambiguous from the totals. Measured: 314 of
    # 1405 files (22.3%) silently excluded, incl. ~58% of react and vue.
    # This rewrites them to workspace-relative, and fails loudly if any path
    # stops resolving.
    - name: Rebase coverage paths to workspace-relative
      run: node tools/scripts/rebase-lcov-paths.mjs

    - name: Upload coverage
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        # libs only. The demo apps still run their tests, but their coverage is
        # not a property of the published libraries — counting them lets a demo
        # page move the number the ratchet gates on.
        files: |
          coverage/libs/**/lcov.info
          coverage/tools/lcov.info
          coverage/api/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to
        # auto-detection and would upload stray unparsable reports.
        disable-search: true
        flags: unit
        finish: true
        fail-ci-if-error: true

  # One leg per image, side by side. Each leg builds, pushes, attests and
  # publishes only its own image. The Node demos use the Dockerfile's
  # `prebuilt` target, which copies dist/apps/<app> from a named build context
  # instead of building from source.
  docker:
    name: image (${{ matrix.label }})
    needs: [build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      # attest-build-provenance also files an artifact-metadata storage record
      # alongside the attestation itself; without this it warns and skips that
      # half. The attestation is still created either way.
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: ng, app: ng-bootstrap-demo, suffix: '', prebuilt: true }
          - { label: react, app: react-bootstrap-demo, suffix: -react-demo, prebuilt: true }
          - { label: vue, app: vue-bootstrap-demo, suffix: -vue-demo, prebuilt: true }
          # The API image builds from source: restore + publish take ~8 s.
          - { label: api, app: api, suffix: -api, prebuilt: false }

    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
      # The build-record artifact each build-push step uploads is ~2 s per
      # image that nothing reads.
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download dist artifact
      if: matrix.prebuilt
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: Authenticate with GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract tags/labels
      id: meta
      uses: docker/metadata-action@v6
      with:
        github-token: ${{ github.token }}
        images: ${{ env.IMAGE }}

    # Built into the local image store and pushed separately, so a failed push
    # (GHCR's "unknown blob" race between legs) retries the push alone.
    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./apps/${{ matrix.app }}/Dockerfile
        target: ${{ matrix.prebuilt && 'prebuilt' || '' }}
        build-contexts: ${{ matrix.prebuilt && format('dist=dist/apps/{0}', matrix.app) || '' }}
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Push
      id: push
      uses: ./.github/actions/docker-push
      with:
        tags: ${{ steps.meta.outputs.tags }}

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    # GHCR packages default to private on first publish, and the VPS's
    # `docker compose pull` then fails with 'denied'. PATCH is idempotent:
    # an already-public package returns 204. A 403/404 is swallowed so a
    # misconfigured token doesn't fail the leg.
    - name: Make the image public
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PACKAGE: ${{ github.event.repository.name }}${{ matrix.suffix }}
      run: |
        gh api --method PATCH \
          "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE" \
          -f visibility=public 2>&1 || echo "  (skipped — already public, missing, or insufficient scope)"

  # ----------------------------------------------------------------------
  # NPM publishing
  #
  # MintPlayer/github-actions/publish-npm-packages scans the given folder,
  # topo-sorts the discovered libs by peerDependencies, and fans out to
  # every registry it's given.
  #
  # ng-bootstrap-snippets is unusual: it publishes from libs/ (source,
  # not dist/) and only goes to NPM, never to GitHub Packages — so it
  # gets its own job with a different `folder` root.
  # ----------------------------------------------------------------------

  publish-libs:
    name: publish-libs
    needs: [build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Version the packages
        id: versioning
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@fc5aa28d12bea9a9c91afee290e13cf586184714 # versioning-v1

      - name: Publish to NPM + GitHub Packages
        # Pinned to b08fbdd (v1.1.0) — the v1.1.0 tag isn't pushed yet on
        # MintPlayer/github-actions. Promote to @v1 once that tag lands.
        uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
        with:
          folder: dist/libs
          registries: |
            [
              { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}" },
              { "url": "https://npm.pkg.github.com", "token": "${{ github.token }}" }
            ]

  # No test covers the snippets, but nothing publishes on a red run (D1), so
  # this still waits for both test jobs. It reads only the snippets source,
  # not dist/.
  publish-snippets:
    name: publish-snippets
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version the packages
        id: versioning
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@fc5aa28d12bea9a9c91afee290e13cf586184714 # versioning-v1

      - name: Publish snippets to NPM
        uses: MintPlayer/github-actions/publish-npm-packages@b08fbddf0b285a8633ac138b89d79ceb8cc8c888
        with:
          folder: libs/mintplayer-ng-bootstrap-snippets
          registries: |
            [
              { "url": "https://registry.npmjs.org", "token": "${{ secrets.PUBLISH_TO_NPMJS }}" }
            ]

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          packagePath: 'libs/mintplayer-ng-bootstrap-snippets'
          pat: ${{ secrets.PUBLISH_SNIPPETS }}
          skipDuplicate: true
          registryUrl: https://marketplace.visualstudio.com

  # Needs the images only: it pulls them from GHCR and restarts compose. The
  # npm packages have nothing to do with it.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          envs: GITHUB_TOKEN
          script: |
            mkdir -p /var/www/ng-bootstrap
            cd /var/www/ng-bootstrap

            # Generate .env from GitHub Secrets (ready for future secrets)
            cat > .env << EOF
            # Future secrets go here, e.g.:
            # SECRET_KEY=value
            EOF

            # Download latest docker-compose.yml from the repository
            rm -f docker-compose.yml
            curl -sf -H "Authorization: token $GITHUB_TOKEN" -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/master/docker-compose.yml

            # Log in to GHCR using the workflow's GITHUB_TOKEN
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker compose --env-file .env pull

            # Recreate only the containers whose image changed. No `down` first:
            # it stopped every container before the new ones could start, which
            # was pure downtime. --remove-orphans still clears services renamed
            # away in docker-compose.yml.
            docker compose --env-file .env up -d --remove-orphans

            # Clean up old images
            docker image prune -f

  # The single check that sums the run up, under the name the old single job
  # had (`publish-master`). `if: always()` so it reports a failure instead of
  # being skipped when a job it needs failed.
  publish-master:
    name: publish-master
    if: always()
    needs: [build, tests, coverage, docker, publish-libs, publish-snippets, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: All jobs passed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo '${{ toJSON(needs) }}'
        exit 1
