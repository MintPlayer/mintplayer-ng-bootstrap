<!doctype html>
<meta charset="utf-8">
<title>S4 — radio-driven slide translation with JS disabled</title>
<!-- No scripts on this page by design: everything must work from parse alone. -->
<style>
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .carousel { width: 300px; margin-bottom: 2rem; }
  .viewport { overflow: hidden; }
  .track { display: flex; transition: transform .15s; }
  .cell { flex: 0 0 100%; min-width: 0; height: 80px; }
  .c0 { background: #fa0; } .c1 { background: #0af; } .c2 { background: #af0; }

  /* horizontal: track width == viewport width, so translateX(-i*100%) is exact */
  #h0:checked ~ .viewport .track { transform: translateX(0); }
  #h1:checked ~ .viewport .track { transform: translateX(-100%); }
  #h2:checked ~ .viewport .track { transform: translateX(-200%); }

  .ind label { display: inline-block; width: 14px; height: 14px; background: #bbb; margin: 2px; cursor: pointer; }
  #h0:checked ~ .ind [for="h0"], #h1:checked ~ .ind [for="h1"], #h2:checked ~ .ind [for="h2"] { background: #000; }

  .controls label { display: none; cursor: pointer; padding: 0 6px; }
  #h0:checked ~ .controls .p0, #h0:checked ~ .controls .n0,
  #h1:checked ~ .controls .p1, #h1:checked ~ .controls .n1,
  #h2:checked ~ .controls .p2, #h2:checked ~ .controls .n2 { display: inline-block; }

  /* vertical attempt: grid-auto-rows:1fr equalises cells at max height, and
     translateY(calc(-i * 100% / N)) moves exactly i cells (N baked per instance).
     The unsolved part is the viewport's own height (must equal ONE cell without
     measurement) — probed here with a fixed height stand-in to isolate the math. */
  .vviewport { overflow: hidden; height: 80px; }
  .vtrack { display: grid; grid-auto-rows: 1fr; transition: transform .15s; }
  .vcell { min-height: 0; }
  .vc0 { background: #fa0; } .vc1 { background: #0af; } .vc2 { background: #af0; }
  #v0:checked ~ .vviewport .vtrack { transform: translateY(0); }
  #v1:checked ~ .vviewport .vtrack { transform: translateY(calc(-1 * 100% / 3)); }
  #v2:checked ~ .vviewport .vtrack { transform: translateY(calc(-2 * 100% / 3)); }
</style>

<h2>horizontal translate</h2>
<div class="carousel">
  <input type="radio" name="h" id="h0" class="vh" checked aria-label="Slide 1">
  <input type="radio" name="h" id="h1" class="vh" aria-label="Slide 2">
  <input type="radio" name="h" id="h2" class="vh" aria-label="Slide 3">
  <div class="viewport"><div class="track">
    <div class="cell c0" id="hs-0">0</div>
    <div class="cell c1" id="hs-1">1</div>
    <div class="cell c2" id="hs-2">2</div>
  </div></div>
  <div class="ind"><label for="h0"></label><label for="h1"></label><label for="h2"></label></div>
  <div class="controls">
    <label class="prev p0" for="h2">prev</label><label class="prev p1" for="h0">prev</label><label class="prev p2" for="h1">prev</label>
    <label class="next n0" for="h1">next</label><label class="next n1" for="h2">next</label><label class="next n2" for="h0">next</label>
  </div>
</div>

<h2>vertical translate (fixed-height viewport stand-in)</h2>
<div class="carousel vcarousel">
  <input type="radio" name="v" id="v0" class="vh" checked aria-label="Slide 1">
  <input type="radio" name="v" id="v1" class="vh" aria-label="Slide 2">
  <input type="radio" name="v" id="v2" class="vh" aria-label="Slide 3">
  <div class="vviewport"><div class="vtrack">
    <div class="vcell vc0" id="vs-0">0</div>
    <div class="vcell vc1" id="vs-1">1</div>
    <div class="vcell vc2" id="vs-2">2</div>
  </div></div>
  <div class="ind"><label for="v0"></label><label for="v1"></label><label for="v2"></label></div>
</div>
