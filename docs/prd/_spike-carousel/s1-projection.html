<!doctype html>
<meta charset="utf-8">
<title>S1 — per-slide cell projection: slot stamping vs manual assignment</title>
<style>
  spike-stamp, spike-manual { display: block; width: 300px; margin-bottom: 1rem; }
  .slide { height: 80px; }
  .a { background: #fa0; } .b { background: #0af; } .c { background: #af0; } .d { background: #f0a; }
</style>

<h2>A — slot="sN" stamping</h2>
<spike-stamp id="stamp">
  <div class="slide a" id="st-a">A</div>
  <div class="slide b" id="st-b">B</div>
  <div class="slide c" id="st-c">C</div>
</spike-stamp>

<h2>B — manual slot assignment</h2>
<spike-manual id="manual">
  <div class="slide a" id="mn-a">A</div>
  <div class="slide b" id="mn-b">B</div>
  <div class="slide c" id="mn-c">C</div>
</spike-manual>

<script type="module">
const baseCss = `
  :host { display: block; }
  .viewport { overflow: hidden; }
  .track { display: flex; }
  .cell { flex: 0 0 100%; min-width: 0; }
`;

function buildShadow(sr) {
  sr.innerHTML = `<style>${baseCss}</style><div class="viewport"><div class="track"></div></div>`;
}

class SpikeStamp extends HTMLElement {
  connectedCallback() {
    if (!this.shadowRoot) this.attachShadow({ mode: 'open' });
    buildShadow(this.shadowRoot);
    this.mo = new MutationObserver(() => this.sync());
    this.mo.observe(this, { childList: true });
    this.sync();
  }
  sync() {
    const kids = [...this.children];
    const track = this.shadowRoot.querySelector('.track');
    track.replaceChildren(...kids.map((k, i) => {
      k.setAttribute('slot', `s${i}`);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.i = String(i);
      const slot = document.createElement('slot');
      slot.name = `s${i}`;
      cell.appendChild(slot);
      return cell;
    }));
    this.setAttribute('data-synced', String(kids.length));
  }
}
customElements.define('spike-stamp', SpikeStamp);

class SpikeManual extends HTMLElement {
  connectedCallback() {
    if (!this.shadowRoot) this.attachShadow({ mode: 'open', slotAssignment: 'manual' });
    buildShadow(this.shadowRoot);
    this.mo = new MutationObserver(() => this.sync());
    this.mo.observe(this, { childList: true });
    this.sync();
  }
  sync() {
    const kids = [...this.children];
    const track = this.shadowRoot.querySelector('.track');
    track.replaceChildren(...kids.map((k, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.i = String(i);
      cell.appendChild(document.createElement('slot'));
      return cell;
    }));
    [...track.querySelectorAll('slot')].forEach((slot, i) => slot.assign(kids[i]));
    this.setAttribute('data-synced', String(kids.length));
  }
}
customElements.define('spike-manual', SpikeManual);
</script>
