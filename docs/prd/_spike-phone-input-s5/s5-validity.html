<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>S5.5 — validity + reportValidity anchored in a shadow root</title>
  <script type="module" src="./bundle.js"></script>
  <style>
    /* Visible proof of :invalid / :user-invalid matching the HOST, not the anchor. */
    mp-spike-phone-input:invalid { outline: 2px solid red; }
    mp-spike-phone-input:user-invalid { background: pink; }
  </style>
</head>
<body>
  <h1>S5.5 validity</h1>

  <form id="f1">
    <input id="before" name="before" value="B" />
    <mp-spike-phone-input id="phone" name="phone" country="be" required></mp-spike-phone-input>
    <button id="submit1" type="submit">Submit</button>
  </form>

  <script>
    window.submitLog = [];
    window.invalidLog = [];
    document.getElementById('f1').addEventListener('submit', (e) => {
      e.preventDefault();
      window.submitLog.push('f1');
    });
    document.getElementById('phone').addEventListener('invalid', () => window.invalidLog.push('phone'));
  </script>
</body>
</html>
