<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>S5.7 — autocomplete plumbing (what can and cannot be automated)</title>
  <script type="module" src="./bundle.js"></script>
</head>
<body>
  <h1>S5.7 autofill</h1>

  <form id="f1" action="/sink" method="get">
    <input id="name" name="name" autocomplete="name" />
    <mp-spike-phone-input
      id="phone"
      name="phone"
      autocomplete="tel"
      inner-autocomplete="tel-national"
    ></mp-spike-phone-input>
    <mp-spike-phone-input
      id="phone-full"
      name="phone-full"
      autocomplete="tel"
      inner-autocomplete="tel"
    ></mp-spike-phone-input>
  </form>
</body>
</html>
