<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>S4.1 — Intl.DisplayNames in-engine</title>
  </head>
  <body>
    <p>S4.1 fixture: computes region display names in this engine.</p>
    <script type="module">
      import { ISO_CODES, LOCALES, AWKWARD, namesFor } from './iso-codes.mjs';
      window.__s4 = {
        codes: ISO_CODES,
        locales: LOCALES,
        names: Object.fromEntries(LOCALES.map((l) => [l, namesFor(l)])),
        namesDefaultLocale: namesFor(undefined),
        defaultLocale: new Intl.DisplayNames(undefined, { type: 'region' }).resolvedOptions().locale,
        navigatorLanguage: navigator.language,
        navigatorLanguages: [...navigator.languages],
        awkward: Object.fromEntries(LOCALES.map((l) => [l, namesFor(l, AWKWARD)])),
      };
      window.__s4ready = true;
    </script>
  </body>
</html>
