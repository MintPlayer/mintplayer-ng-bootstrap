<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>S7 — AsYouType caret preservation</title>
    <style>
      body { font: 14px system-ui; padding: 1rem; }
      label { display: block; margin: 0.75rem 0; }
      input { font: 14px monospace; width: 22em; }

  <body>
    <label>naive (bug) <input id="naive" type="tel" /></label>

    <script type="module" src="./s7-caret.bundle.js"></script>
  </body>
