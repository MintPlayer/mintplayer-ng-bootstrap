@if (classes().root; as rootClass) {
  <label data-mps="radio" [class]="rootClass">
    <input data-mps="radio" type="radio" [class]="classes().input" [mpProps]="bags().input" [checked]="checked()" [attr.checked]="checked() ? '' : null" (change)="onChange($event)">
    <span data-mps="radio" [class]="classes().label"><ng-container [ngTemplateOutlet]="content"></ng-container></span>
  </label>
} @else {
  <input data-mps="radio" type="radio" [class]="classes().input" [mpProps]="bags().input" [checked]="checked()" [attr.checked]="checked() ? '' : null" (change)="onChange($event)">
  <label data-mps="radio" [class]="classes().label" [attr.for]="bags().labelFor"><ng-container [ngTemplateOutlet]="content"></ng-container></label>
}
@if (bags().feedback; as feedback) {
  <div data-mps="radio" [mpProps]="feedback.attrs">{{ feedback.text }}</div>
}
<ng-template #content><ng-content></ng-content></ng-template>
