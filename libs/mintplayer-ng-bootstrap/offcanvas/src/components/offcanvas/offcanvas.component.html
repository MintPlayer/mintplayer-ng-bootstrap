@if (showBackdrop()) {
    <div data-mps="offcanvas" [@fadeInOut]="{value: ':leave', params: {duration: '300ms'} }">
        <div data-mps="offcanvas" class="modal-backdrop show" (click)="onBackdropClick($event)" aria-hidden="true"></div>
    </div>
}
<div data-mps="offcanvas" class="offcanvas"
    [class.show]="show()"
    [class.disable-transition]="disableTransition()"
    [class]="[offcanvasClass(), overflowClass()]"
    [style.height.px]="height()"
    [style.width.px]="width()"
    role="dialog"
    [attr.aria-modal]="hasBackdrop() ? 'true' : null"
    [attr.aria-labelledby]="context.headerId()"
    [attr.aria-describedby]="context.bodyId()"
    [bsOverlayFocus]="isVisible()"
    tabindex="-1">
    <ng-container *ngTemplateOutlet="contentTemplate; injector: injector"></ng-container>
</div>
