<mp-carousel
  #el
  [attr.animation]="animation()"
  [attr.orientation]="orientation()"
  [attr.aria-label]="ariaLabel()"
  (slide-change)="onSlideChange($event)"
  (paused-change)="onPausedChange($event)"
  (animation-start)="animationStart.emit()"
  (animation-end)="animationEnd.emit()"
>
  <ng-content></ng-content>
</mp-carousel>
