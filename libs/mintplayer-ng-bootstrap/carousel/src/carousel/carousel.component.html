<mp-carousel
    #element
    [attr.animation]="animation()"
    [attr.orientation]="orientation()"
    [attr.indicators]="indicatorsAttr()"
    [attr.interval]="intervalAttr()"
    [attr.wrap]="wrapAttr()"
    [attr.keyboard-events]="keyboardEventsAttr()"
    [attr.paused]="pausedAttr()"
    [attr.aria-label]="ariaLabel()"
    (slide-change)="onSlideChange($event)"
    (paused-change)="onPausedChange($event)"
    (animation-start)="onAnimationStart($event)"
    (animation-end)="onAnimationEnd($event)">
    <ng-content></ng-content>
</mp-carousel>
