<div [class]="wrapperPosition()" class="h-100">
    @if (showCorners()) {
        <div [bsResizeGlyph]="['top', 'start']"></div>
        <div [bsResizeGlyph]="['top', 'end']"></div>
        <div [bsResizeGlyph]="['bottom', 'end']"></div>
        <div [bsResizeGlyph]="['bottom', 'start']"></div>
    }
    @if (vertical()) {
        <div [bsResizeGlyph]="['top']"></div>
        <div [bsResizeGlyph]="['bottom']"></div>
    }
    @if (horizontal()) {
        <div [bsResizeGlyph]="['end']"></div>
        <div [bsResizeGlyph]="['start']"></div>
    }
    <ng-content></ng-content>
</div>
