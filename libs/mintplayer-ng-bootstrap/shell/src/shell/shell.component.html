<a [mpProps]="view().skip" [attr.href]="view().skipHref" (click)="onSkip($event)">{{ view().skipText }}</a>
@for (toggle of view().toggles; track toggle.mode) {
  <input [mpProps]="toggle.input" (change)="onToggleChange($event)" />
}
<div [mpProps]="view().topbar">
  @for (toggle of view().toggles; track toggle.mode) {
    <label [mpProps]="toggle.label">{{ view().hamburgerText }}</label>
  }
  <ng-container [ngTemplateOutlet]="topbar()?.template ?? null" />
</div>
<div [mpProps]="view().sidebarRoot">
  <aside [mpProps]="view().sidebar"><ng-container [ngTemplateOutlet]="sidebar()?.template ?? null" /></aside>
  <div [mpProps]="view().content"><ng-content /></div>
</div>
