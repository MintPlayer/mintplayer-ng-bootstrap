<bs-has-overlay></bs-has-overlay>
<div data-mps="tooltip" [@fadeInOut] class="tooltip position-absolute show"
    [class]="[positionClass(), marginClass()]"
    [id]="tooltipId"
    role="tooltip">
    <div data-mps="tooltip" class="tooltip-arrow position-absolute" aria-hidden="true"></div>
    <div data-mps="tooltip" class="tooltip-inner">
        <ng-container *ngTemplateOutlet="template"></ng-container>
    </div>
</div>
