<nav data-mps="pagination" [mpProps]="navBag()">
  <ul data-mps="pagination" [class]="view().listClass">
    @for (entry of view().entries; track entry.key) {
      <li data-mps="pagination" [class]="entry.itemClass">
        @if (entry.kind === 'gap') {
          <span data-mps="pagination" [mpProps]="entry.attrs">{{ entry.text }}</span>
        } @else if (view().tag === 'a') {
          <a data-mps="pagination" [mpProps]="entry.attrs" [attr.href]="entry.href" (click)="onLinkClick($event, entry.target)">{{ entry.text }}</a>
        } @else {
          <button data-mps="pagination" [mpProps]="entry.attrs" (click)="select(entry.target)">{{ entry.text }}</button>
        }
      </li>
    }
  </ul>
</nav>
