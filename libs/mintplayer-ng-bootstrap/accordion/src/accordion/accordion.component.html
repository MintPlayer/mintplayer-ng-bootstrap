@for (tab of tabPages(); track tab; let i = $index) {
  @let view = views()[i];
  <details [mpProps]="view.item" [attr.open]="tab.isActive() ? '' : null">
    <summary [mpProps]="view.summary" (click)="onSummaryClick($event, tab)" (keydown)="onSummaryKeydown($event, i, tab)">
      <ng-container [ngTemplateOutlet]="tab.headerTemplate()?.template ?? null" />
    </summary>
    <div [mpProps]="view.content"><ng-container [ngTemplateOutlet]="tab.body() ?? null" /></div>
  </details>
}
<ng-content />
