@if (tabControl.isServerSide) {
	<!-- region, not tabpanel: the no-JS tier ships no role="tab" (a static
	     aria-selected would go stale), and a tabpanel without a tab is an
	     orphan. The label id still names the region. -->
	<div [id]="tabName() + '-panel'"
		class="tab-page-content"
		role="region"
		[attr.aria-labelledby]="tabName() + '-header'"
		[class.d-block]="tabControl.activeTab() === this">
		<ng-content></ng-content>
	</div>
} @else {
	<ng-content></ng-content>
}
