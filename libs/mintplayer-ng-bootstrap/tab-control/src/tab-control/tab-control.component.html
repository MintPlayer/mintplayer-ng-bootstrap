@let v = view();
@for (tab of tabPages(); track tab; let i = $index) {
  <input [mpProps]="v.tabs[i].radio" [checked]="i === activeIndex()" [attr.checked]="i === activeIndex() ? '' : null">
}
@if (!bottomTabs()) {
  <ng-container [ngTemplateOutlet]="strip" />
}
<div [mpProps]="v.content">
  @for (tab of tabPages(); track tab; let i = $index) {
    <div [mpProps]="v.tabs[i].pane"><ng-container [ngTemplateOutlet]="tab.body() ?? null" /></div>
  }
</div>
@if (bottomTabs()) {
  <ng-container [ngTemplateOutlet]="strip" />
}
<ng-content />

<ng-template #strip>
  <div [mpProps]="v.strip">
    <ul [mpProps]="v.list">
      @for (tab of tabPages(); track tab; let i = $index) {
        <li [mpProps]="v.item">
          <label [mpProps]="v.tabs[i].tab" (click)="onTabClick($event, tab)" (keydown)="onTabKeydown($event, i)">
            <ng-container [ngTemplateOutlet]="tab.headerTemplate()?.template ?? null" />
          </label>
        </li>
      }
    </ul>
  </div>
</ng-template>
