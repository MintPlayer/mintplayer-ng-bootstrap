<nav class="priority-nav" [class.noscript]="isServerSide" [attr.aria-label]="ariaLabel()" bsNoNoscript>
    @if (isServerSide) {
        <!-- The checkbox IS the disclosure control: clipped (not display:none)
             so Tab reaches it, Space toggles it natively, and its checked
             state is a live, self-updating expanded signal — a static
             aria-expanded here would lie after the first toggle (PRD 11a). -->
        <input type="checkbox" [id]="uid + '-more'" class="priority-nav-more-checkbox" bsNoNoscript
               [attr.aria-controls]="uid + '-overflow'">
    }

    @if (!isServerSide) {
        <!-- inert (not just aria-hidden): the clone's links/buttons must be
             unreachable by Tab too, or focus lands on nodes the reader is
             required not to announce. Measurement needs geometry, which inert
             preserves (display:none would zero every measure). -->
        <div class="priority-nav-measure-wrapper" aria-hidden="true" inert>
            <div class="priority-nav-measure">
                @for (entry of itemsWithMeta(); track entry.item.id) {
                    <span #measureItem="bsObserveSize" bsObserveSize class="priority-nav-measure-item">
                        <ng-container *ngTemplateOutlet="entry.item.templateRef"></ng-container>
                    </span>
                }
            </div>
        </div>
    }

    <div bsObserveSize #stripSize="bsObserveSize" class="priority-nav-strip">
        @for (entry of itemsWithMeta(); track entry.item.id) {
            <span class="priority-nav-item"
                  [class.priority-nav-hidden]="entry.hideInline"
                  [ngClass]="entry.hideBelowClass">
                <ng-container *ngTemplateOutlet="entry.item.templateRef"></ng-container>
            </span>
        }

        @if (isServerSide) {
            <!-- Visual skin + accessible name for the clipped checkbox; the
                 fake role="button"/tabindex pair is gone — a label does not
                 activate on Enter, so it claimed a keyboard it did not have. -->
            <label [for]="uid + '-more'" class="priority-nav-more-toggle priority-nav-more-toggle-noscript">
                <ng-container *ngTemplateOutlet="moreLabelTemplate() ?? defaultMoreLabel; context: { $implicit: false }"></ng-container>
            </label>
        } @else {
            <!-- Disclosure pattern: aria-expanded on the button; no
                 aria-haspopup (that token means menu/dialog, and the overflow
                 is a plain disclosure list). -->
            <button bsObserveSize #moreSize="bsObserveSize" type="button"
                    class="priority-nav-more-toggle"
                    [class.priority-nav-hidden]="!showMoreButton()"
                    (click)="toggleMore()"
                    [attr.aria-controls]="uid + '-overflow'"
                    [attr.aria-expanded]="isMoreOpen()">
                <ng-container *ngTemplateOutlet="moreLabelTemplate() ?? defaultMoreLabel; context: { $implicit: isMoreOpen() }"></ng-container>
            </button>
        }
    </div>

    <!-- No role="menu"/"menuitem": this is a disclosure overflow list (APG
         disclosure navigation), and a menu role would demand a focus-managed
         menuitem keyboard model the projected links neither need nor have. -->
    <div [id]="uid + '-overflow'"
         class="priority-nav-overflow"
         [class.priority-nav-overflow-open]="!isServerSide && isMoreOpen()"
         [class.priority-nav-overflow-align-start]="!isServerSide && fullyCollapsed()">
        @for (entry of itemsWithMeta(); track entry.item.id) {
            <span class="priority-nav-overflow-item"
                  [class.priority-nav-overflow-hidden]="entry.hideInOverflow"
                  [ngClass]="entry.hideBelowClass">
                <ng-container *ngTemplateOutlet="entry.item.templateRef"></ng-container>
            </span>
        }
    </div>
</nav>

<ng-template #defaultMoreLabel let-isOpen>
    <span class="priority-nav-more-label">{{ moreLabel() }}</span>
    <span class="priority-nav-caret" aria-hidden="true">&#9662;</span>
</ng-template>
