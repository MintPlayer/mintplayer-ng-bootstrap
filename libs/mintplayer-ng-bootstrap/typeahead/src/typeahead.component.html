<div class="mp-typeahead" [mpProps]="api().root">
  <input #input
    class="form-control"
    type="text"
    [mpProps]="api().input"
    [value]="state().term"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()" />
  <ul class="dropdown-menu" [mpProps]="api().listbox">
    @if (api().status; as status) {
      <li class="ta-status" [mpProps]="status.attrs">{{ status.text }}</li>
    }
    @for (item of state().items; track trackItem($index, item); let i = $index) {
      <li class="dropdown-item" [mpProps]="api().option(i)" (mousedown)="$event.preventDefault()" (click)="machine.pick(i)">
        <ng-container *ngTemplateOutlet="itemTemplate()?.templateRef ?? defaultItem; context: { $implicit: item, term: state().term }"></ng-container>
      </li>
    }
  </ul>
  <span class="visually-hidden" [mpProps]="api().live.attrs">{{ api().live.text }}</span>
  @if (api().error; as error) {
    <div class="ta-error" [mpProps]="error.attrs">{{ error.text }}</div>
  }
</div>
<ng-template #defaultItem let-item>{{ machine.itemTextOf(item) }}</ng-template>
