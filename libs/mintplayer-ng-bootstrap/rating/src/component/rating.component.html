@for (star of stars(); let i = $index; track i) {
    <button type="button"
        #star
        class="cursor-pointer btn-star"
        role="radio"
        [attr.tabindex]="starTabIndexes()[i]"
        (mouseenter)="hoverValue(i)"
        (click)="selectValue(i)"
        [attr.aria-label]="starLabels()[i]"
        [attr.aria-checked]="value() === (i + 1)">
        <span aria-hidden="true">{{ star ? '&#9733;' : '&#9734;' }}</span>
    </button>
}
