<div class="d-block" data-mps="table" [class.table-responsive]="isResponsive()" [class.nowrap]="isResponsive()">

        [class.mb-0]="isResponsive()"
        [class.table-striped]="striped()"
        [class.table-hover]="hover()"
        [class.border]="border()"

        <ng-content></ng-content>

    </table>
</div>
